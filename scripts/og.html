<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Google Sans Flex'; font-weight: 300 800; src: url('../public/fonts/google-sans-flex-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Google Sans Code'; font-weight: 400 700; src: url('../public/fonts/google-sans-code-latin.woff2') format('woff2'); }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; font-family: 'Google Sans Flex', sans-serif; color: #0d1a2c; overflow: hidden; position: relative;
    background:
      radial-gradient(700px 420px at 4% -10%, rgba(109,141,255,.28), transparent 62%),
      radial-gradient(640px 420px at 100% 0%, rgba(212,50,107,.16), transparent 60%),
      radial-gradient(700px 440px at 70% 110%, rgba(15,143,168,.18), transparent 62%),
      #f3f6fb; }
  .brand { position: absolute; left: 72px; top: 60px; display: flex; align-items: center; gap: 14px; font-weight: 640; font-size: 30px; letter-spacing: -0.02em; }
  h1 { position: absolute; left: 72px; top: 150px; width: 580px; font-size: 70px; line-height: 0.98; letter-spacing: -0.04em; font-weight: 580; }
  p { position: absolute; left: 72px; top: 410px; width: 540px; font-size: 27px; line-height: 1.4; color: #435269; }
  .wf { position: absolute; left: 700px; top: 150px; width: 430px; background: #fff; border: 1px solid #e0e6f0; border-radius: 28px; padding: 30px 28px 26px; box-shadow: 0 2px 6px rgba(13,26,44,.05), 0 32px 64px -28px rgba(24,44,92,.35); }
  .row { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 14px; margin-bottom: 20px; }
  .row:last-child { margin-bottom: 0; }
  .row b { font-size: 22px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 9px; }
  .row b i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .track { position: relative; height: 26px; border-radius: 8px; background: #f1f4fa; }
  .track span { position: absolute; top: 3px; bottom: 3px; border-radius: 6px; }
  .tag { position: absolute; left: 72px; bottom: 52px; font-family: 'Google Sans Code', monospace; font-size: 22px; color: #75839a; }
  .legend { display: flex; gap: 16px; margin: 22px 0 0 0; font-size: 15px; color: #435269; white-space: nowrap; justify-content: flex-end; }
  .legend em { font-style: normal; display: inline-flex; align-items: center; gap: 7px; }
  .legend em i { width: 14px; height: 10px; border-radius: 3px; display: block; }
</style>
</head>
<body>
  <div class="brand">
    <svg viewBox="0 0 32 32" width="40" height="40"><rect width="32" height="32" rx="9" fill="#0d1a2c"/><rect x="6" y="9" width="12" height="3.4" rx="1.7" fill="#7aa2ff"/><rect x="11" y="14.3" width="15" height="3.4" rx="1.7" fill="#ff8fb1"/><rect x="8" y="19.6" width="9" height="3.4" rx="1.7" fill="#5fe0b0"/></svg>
    renderlab
  </div>
  <h1>See what each rendering strategy costs</h1>
  <p>Seven strategies, one product page, one slow phone.</p>
  <div class="wf">
    <div class="row"><b><i style="background:#ea5a0f"></i>CSR</b><div class="track">
      <span style="left:0;width:6%;background:#b4bfd0"></span><span style="left:6%;width:14%;background:#ffb347"></span><span style="left:20%;width:50%;background:#ff7b5c"></span><span style="left:70%;width:20%;background:#36c3a0"></span></div></div>
    <div class="row"><b><i style="background:#3d5ce6"></i>SSR</b><div class="track">
      <span style="left:0;width:6%;background:#b4bfd0"></span><span style="left:6%;width:34%;background:#1a2740"></span><span style="left:40%;width:12%;background:#ffb347"></span><span style="left:52%;width:36%;background:#e5484d"></span></div></div>
    <div class="row"><b><i style="background:#7a4cf5"></i>Stream</b><div class="track">
      <span style="left:0;width:6%;background:#b4bfd0"></span><span style="left:6%;width:6%;background:#6d8dff"></span><span style="left:12%;width:30%;background:#36c3a0"></span><span style="left:13%;width:12%;background:#ffb347;top:auto;height:7px;bottom:3px"></span><span style="left:42%;width:30%;background:#e5484d;opacity:.0"></span></div></div>
    <div class="row"><b><i style="background:#d4326b"></i>RSC</b><div class="track">
      <span style="left:0;width:6%;background:#b4bfd0"></span><span style="left:6%;width:6%;background:#6d8dff"></span><span style="left:13%;width:12%;background:#ffb347"></span><span style="left:25%;width:16%;background:#ff7b5c"></span><span style="left:41%;width:12%;background:#e5484d"></span></div></div>
    <div class="row"><b><i style="background:#d99a00"></i>PPR</b><div class="track">
      <span style="left:0;width:6%;background:#b4bfd0"></span><span style="left:6%;width:4%;background:#6d8dff"></span><span style="left:11%;width:12%;background:#ffb347"></span><span style="left:23%;width:16%;background:#ff7b5c"></span><span style="left:39%;width:12%;background:#e5484d"></span></div></div>
    <div class="legend"><em><i style="background:#ffb347"></i>JS download</em><em><i style="background:#ff7b5c"></i>Run JS</em><em><i style="background:#e5484d"></i>Hydrate</em></div>
  </div>
  <div class="tag">haris-devo.github.io/renderlab</div>
</body>
</html>
